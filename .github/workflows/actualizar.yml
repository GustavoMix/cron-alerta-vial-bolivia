name: Actualizar tránsito Bolivia

on:
  workflow_dispatch:
  schedule:
    # Cada 30 minutos, evitando el minuto 0.
    # GitHub Actions interpreta cron en UTC.
    - cron: "13,43 * * * *"

permissions:
  contents: write

concurrency:
  group: transito-bolivia-cron
  cancel-in-progress: true

jobs:
  # Decide qué fuente va en qué grupo. No es un reparto fijo: usa el historial
  # (data/_interno/facebook_rotacion.json) para que la fuente que lleva más
  # tiempo sin traer datos se lleve el PRIMER turno de un grupo, que es el que
  # casi siempre pasa antes de que Facebook corte esa IP.
  planificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matriz: ${{ steps.plan.outputs.matriz }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Planificar grupos de Facebook
        id: plan
        run: python main.py --planificar-facebook --tamano-grupo 2 >> "$GITHUB_OUTPUT"

  # Un job por grupo, cada uno en su propio runner y por lo tanto con su propia
  # IP de salida. Facebook deja pasar 1-2 páginas por IP antes de bloquear, así
  # que con grupos de 2 casi ninguna fuente se pierde en cascada detrás de otra
  # (con grupos de 5 se perdían hasta 4 por bloqueo).
  scrape-facebook:
    needs: planificar
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix: ${{ fromJSON(needs.planificar.outputs.matriz) }}
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar Chromium de Playwright
        run: |
          python -m playwright install --with-deps chromium

      - name: Escalonar el arranque del grupo
        # Si los 15 grupos golpean Facebook en el mismo segundo desde IPs del
        # mismo rango de Azure, el patrón se lee como una sola flota aunque las
        # IPs sean distintas. Separarlos unos segundos cuesta nada.
        run: sleep $(( ${{ matrix.orden }} * 4 + RANDOM % 7 ))

      - name: Scrapear grupo de Facebook
        run: |
          python main.py \
            --only "${{ matrix.fuentes }}" \
            --facebook-scrape-group-out "data/_interno/facebook_raw_${{ matrix.nombre }}.json"

      - name: Subir resultado crudo del grupo
        uses: actions/upload-artifact@v4
        with:
          name: facebook-raw-${{ matrix.nombre }}
          path: data/_interno/facebook_raw_${{ matrix.nombre }}.json
          if-no-files-found: error
          retention-days: 1

  actualizar:
    needs: scrape-facebook
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Bajar resultados crudos de Facebook
        uses: actions/download-artifact@v4
        with:
          pattern: facebook-raw-*
          path: data/_interno/
          merge-multiple: true

      - name: Scrapear fuentes web, combinar Facebook y clasificar
        shell: bash
        run: |
          RAW_FILES=$(ls data/_interno/facebook_raw_*.json 2>/dev/null | paste -sd,)
          if [ -z "$RAW_FILES" ]; then
            echo "No llegó ningún resultado de Facebook de los jobs del grupo; se sigue solo con las fuentes web."
            python main.py --only web_abc,web_abc_comunicados,web_lapaz,web_amun,web_cbba,web_simat_cbba,web_scz
          else
            python main.py --facebook-raw-in "$RAW_FILES"
          fi

      - name: Guardar resultados actualizados
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/transito_bolivia.json \
            data/transito_bolivia.csv \
            data/estado_fuentes.json \
            data/_interno/incidentes_historial.json \
            data/_interno/facebook_rotacion.json

          if git diff --cached --quiet; then
            echo "Sin cambios para guardar."
          else
            git commit -m "Actualizar tránsito Bolivia"
            git push
          fi
