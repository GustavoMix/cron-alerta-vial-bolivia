name: Actualizar tránsito Bolivia

on:
  workflow_dispatch:
  schedule:
    # Cada 30 minutos, evitando el minuto 0.
    # GitHub Actions interpreta cron en UTC.
    - cron: "13,43 * * * *"

permissions:
  contents: write

concurrency:
  group: transito-bolivia-cron
  cancel-in-progress: true

env:
  # Facebook deja pasar solo ~2 fuentes por IP antes de degradar el contenido
  # (login wall / og:description en vez del post real). La mitigación es correr
  # cada grupo pequeño en su propio job: cada runner de GitHub Actions es una
  # VM efímera con su propia IP de salida, así que más grupos = más IPs.
  # Con tamaño 2 quedó ~1/3 de las fuentes todavía degradadas; se baja a 1
  # (una fuente por IP/job) para ver si eso las destraba también.
  FB_GROUP_SIZE: "1"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Calcular grupos de fuentes Facebook
        id: plan
        run: echo "matrix=$(python3 scripts/plan_scrape_groups.py)" >> "$GITHUB_OUTPUT"

  scrape-facebook:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar Chromium de Playwright
        run: |
          python -m playwright install --with-deps chromium

      - name: "Scrapear grupo ${{ matrix.group }} (${{ matrix.ids }})"
        run: |
          python -m scraper.runner --mode scrape \
            --only "${{ matrix.ids }}" \
            --partial-out "partials/${{ matrix.group }}.json"

      - name: Subir parcial
        uses: actions/upload-artifact@v4
        with:
          name: partial-${{ matrix.group }}
          path: partials/${{ matrix.group }}.json
          retention-days: 1
          if-no-files-found: warn

  scrape-web:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scrapear fuentes web
        run: |
          python -m scraper.runner --mode scrape \
            --only-type generic_web \
            --partial-out "partials/web.json"

      - name: Subir parcial
        uses: actions/upload-artifact@v4
        with:
          name: partial-web
          path: partials/web.json
          retention-days: 1
          if-no-files-found: warn

  merge:
    needs: [scrape-facebook, scrape-web]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Descargar parciales
        uses: actions/download-artifact@v4
        with:
          pattern: partial-*
          path: partials
          merge-multiple: true

      - name: Combinar resultados y escribir data/
        run: python -m scraper.runner --mode merge --partials-dir partials --out data

      - name: Guardar resultados actualizados
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/transito_bolivia.json \
            data/transito_bolivia.csv \
            data/estado_fuentes.json \
            data/_interno/incidentes_historial.json

          if git diff --cached --quiet; then
            echo "Sin cambios para guardar."
          else
            git commit -m "Actualizar tránsito Bolivia"
            git push
          fi
